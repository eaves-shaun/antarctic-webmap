<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Antarctic EPSG:3031 COG Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 10px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div class="info">
    EPSG:3031 Antarctic COG test<br>
    Replace <code>./temperature.tif</code> with your COG path or URL.
  </div>

  <script type="module">
    import Map from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/Map.js';
    import View from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/View.js';
    import WebGLTileLayer from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/layer/WebGLTile.js';
    import GeoTIFF from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/source/GeoTIFF.js';
    import Projection from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/proj/Projection.js';
    import {register} from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/proj/proj4.js';
    import {get as getProjection} from 'https://cdn.jsdelivr.net/npm/ol@10.6.1/proj.js';
    import proj4 from 'https://cdn.jsdelivr.net/npm/proj4@2.12.1/+esm';

    // ---------------------------------------------------------------------
    // 1. Replace this with your own COG path or URL
    // Examples:
    //const cogUrl = 'data/bed-elevation.tif';
    const cogUrl = 'https://github.com/eaves-shaun/antarctic-webmap/releases/download/v1.0/bed-elevation.tif';
    // ---------------------------------------------------------------------
    //const cogUrl = './temperature.tif';

    // ---------------------------------------------------------------------
    // 2. Register EPSG:3031 Antarctic Polar Stereographic
    // ---------------------------------------------------------------------
    proj4.defs(
      'EPSG:3031',
      '+proj=stere +lat_0=-90 +lat_ts=-71 +lon_0=0 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs +type=crs'
    );
    register(proj4);

    const projection = getProjection('EPSG:3031') || new Projection({
      code: 'EPSG:3031',
      units: 'm'
    });

    // A broad square extent around Antarctica in metres.
    // Adjust if your raster covers a smaller region.
    projection.setExtent([
      -3333134, -3333134,
       3333134,  3333134
    ]);

    // ---------------------------------------------------------------------
    // 3. COG raster layer
    // ---------------------------------------------------------------------
    const raster = new WebGLTileLayer({
      source: new GeoTIFF({
        normalize: false,
        sources: [
          {
            url: cogUrl
          }
        ]
      }),

      // colour ramp
      style: {
        color: [
          "interpolate",
          ["linear"],
          ["band", 1],
      
          // Below sea level
          -3000, [  8,  48, 107],
          -2000, [ 33, 102, 172],
          -1000, [103, 169, 207],
           -500, [170, 220, 240],
             -1, [220, 245, 255],
      
          // Hard boundary at sea level
              0, [ 60, 170,  60],
      
            500, [150, 200,  90],
           1000, [200, 185, 120],
           2000, [170, 130,  80],
           3000, [130,  90,  50],
           4000, [ 90,  60,  35]
        ]
      }
    });

    // ---------------------------------------------------------------------
    // 4. Build the map
    // ---------------------------------------------------------------------
    const map = new Map({
      target: 'map',
      layers: [
        raster
      ],
      view: new View({
        projection: projection,
        center: [0, 0],
        zoom: 2,
        minZoom: 0,
        maxZoom: 8
      })
    });

    // ---------------------------------------------------------------------
    // 5. Basic console checks
    // ---------------------------------------------------------------------
    console.log('OpenLayers EPSG:3031 COG test loaded');
    console.log('COG URL:', cogUrl);
    console.log('Projection:', projection.getCode());
  </script>
</body>
</html>
