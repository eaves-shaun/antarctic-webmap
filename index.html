<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Antarctic EPSG:3031 BEDMAP Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.9);
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
<div id="map"></div>
<div class="info">BEDMAP COG test (EPSG:3031)</div>

<script type="module">
import Map from 'https://esm.sh/ol@10.6.1/Map';
import View from 'https://esm.sh/ol@10.6.1/View';
import WebGLTileLayer from 'https://esm.sh/ol@10.6.1/layer/WebGLTile';
import GeoTIFF from 'https://esm.sh/ol@10.6.1/source/GeoTIFF';
import {register} from 'https://esm.sh/ol@10.6.1/proj/proj4';
import {get as getProjection} from 'https://esm.sh/ol@10.6.1/proj';
import proj4 from 'https://esm.sh/proj4';

const cogUrl = 'https://github.com/eaves-shaun/antarctic-webmap/releases/download/v1.0/bed-elevation.tif';

proj4.defs(
  'EPSG:3031',
  '+proj=stere +lat_0=-90 +lat_ts=-71 +lon_0=0 +datum=WGS84 +units=m +no_defs'
);
register(proj4);

const projection = getProjection('EPSG:3031');
projection.setExtent([
  -3333134,-3333134,
   3333134, 3333134
]);

const raster = new WebGLTileLayer({
  source: new GeoTIFF({
    sources: [{ url: cogUrl }],
    normalize: false
  }),

  style: {
    color: [
      'interpolate',
      ['linear'],
      ['band',1],

      -3000, [8,48,107],
      -2000, [33,102,172],
      -1000, [103,169,207],
       -500, [170,220,240],
         -1, [220,245,255],

          0, [60,170,60],

        500, [150,200,90],
       1000, [200,185,120],
       2000, [170,130,80],
       3000, [130,90,50],
       4000, [90,60,35]
    ]
  }
});

const map = new Map({
  target: 'map',
  layers: [raster],
  view: new View({
    projection: projection,
    center: [0,0],
    zoom: 2
  })
});

console.log('Map initialised');
console.log('COG:', cogUrl);
</script>

</body>
</html>
